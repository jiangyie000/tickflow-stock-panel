# stockdb 本地数据源插件 (SDK 直连版)
# 通过本地 SDK (stock_sdk) 直连 stockdb K-V 数据库服务, 默认 127.0.0.1:7899。
# SDK 内置复权因子预加载 + pipe 批量拉取, 全市场日K ~5 秒完成。
# 提供: 日K / 复权因子 / 分钟K / 实时(取最近一日日K为快照) / 标的维表。
# 不提供: 财务 (自动回退 TickFlow)。

name: stockdb
display_name: "stockdb（本地数据库）"
# runtime: none — 插件通过 stock_sdk (已安装到 site-packages) 直连, 不需要 pip install。
runtime: none
entry: app.plugins.stockdb.provider:StockDBProvider
check: app.plugins.stockdb.bridge:availability
datasets: [daily, adj_factor, minute, realtime]
description: "本地 stockdb SDK 直连, 内置复权+批量拉取, 全市场日K ~5秒。覆盖日K/复权/分钟/实时快照/标的。"
install_hint: "启动 stockdb 服务 (127.0.0.1:7899), 安装 SDK: python stockdb/pybao/安装.py"
